name: P3 — vault bootstrap + drafts surface

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  p3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install bats + jq
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq

      # ---------- shellcheck ----------

      - name: shellcheck bin/kunskap + hooks
        run: |
          shellcheck -e SC1090,SC1091 bin/kunskap hooks/session-start.sh hooks/post-write-sync.sh
          shellcheck hooks/_shared.sh

      # ---------- bin/kunskap surface health ----------

      - name: bin/kunskap version matches manifest
        run: |
          manifest=$(jq -r .version .claude-plugin/plugin.json)
          out=$(./bin/kunskap version)
          [[ "$out" == "kunskap $manifest" ]] \
            || { echo "drift: bin says '$out', plugin.json says '$manifest'"; exit 1; }

      - name: bin/kunskap help mentions init + drafts (P3 surface)
        run: |
          ./bin/kunskap help | grep -q 'kunskap init <path>'
          ./bin/kunskap help | grep -q 'kunskap drafts list'
          ./bin/kunskap help | grep -q 'kunskap drafts show'
          ./bin/kunskap help | grep -q 'kunskap drafts approve'
          ./bin/kunskap help | grep -q 'kunskap drafts reject'
          ./bin/kunskap help | grep -q 'kunskap drafts defer'

      # ---------- templates/ shape (P3 deliverable) ----------

      - name: templates/vault-init/ has required tree
        run: |
          for f in \
            templates/vault-init/_meta/kunskap.toml \
            templates/vault-init/_meta/roles.toml \
            templates/vault-init/wiki/_index.md \
            templates/vault-init/README.md \
            templates/vault-init/.gitignore \
            templates/article.md \
            templates/inbox-note.md; do
            [[ -f "$f" ]] || { echo "missing template file: $f"; exit 1; }
          done
          for d in \
            templates/vault-init/raw/inbox \
            templates/vault-init/wiki/_drafts \
            templates/vault-init/wiki/learnings \
            templates/vault-init/wiki/ideas \
            templates/vault-init/wiki/concepts \
            templates/vault-init/wiki/patterns \
            templates/vault-init/wiki/bases \
            templates/vault-init/Archives/processed-inbox \
            templates/vault-init/Archives/processed-drafts/approved \
            templates/vault-init/Archives/processed-drafts/rejected; do
            [[ -d "$d" ]] || { echo "missing template dir: $d"; exit 1; }
            # Empty dirs need .gitkeep to survive git, but a dir that ships
            # other tracked content (e.g. wiki/bases/*.base from P6) doesn't
            # need one — accept either.
            tracked_count=$(find "$d" -type f -not -name '.gitkeep' | wc -l)
            if [[ "$tracked_count" -eq 0 && ! -f "$d/.gitkeep" ]]; then
              echo "missing $d/.gitkeep (empty dir wouldn't survive git)"
              exit 1
            fi
          done

      - name: templates carry the substitution placeholders init expects
        run: |
          # If init expects {{name}}/{{created}}/{{shared}} and the templates
          # don't carry them, the substitution silently no-ops. Lint it.
          grep -q '{{name}}'    templates/vault-init/_meta/kunskap.toml
          grep -q '{{created}}' templates/vault-init/_meta/kunskap.toml
          grep -q '{{shared}}'  templates/vault-init/_meta/kunskap.toml
          grep -q '{{name}}'    templates/vault-init/wiki/_index.md
          grep -q '{{created}}' templates/vault-init/wiki/_index.md
          grep -q '{{name}}'    templates/vault-init/README.md

      # ---------- commands/ surface ----------

      - name: commands/drafts.md exists and declares argument-hint
        run: |
          [[ -f commands/drafts.md ]]
          grep -q '^argument-hint:' commands/drafts.md
          grep -q '^description:'   commands/drafts.md

      # ---------- bats suites (counts derived dynamically — no drifty strings) ----------

      # P1 §7: counts get printed dynamically; never encoded in step names.
      - name: list test counts
        run: |
          for f in tests/contract/*.bats; do
            n=$(grep -c '^@test ' "$f")
            printf '  %-30s %d cases\n' "$(basename "$f")" "$n"
          done

      - name: bats — init CLI surface (P3)
        run: bats tests/contract/init-cli.bats

      - name: bats — drafts CLI surface (P3)
        run: bats tests/contract/drafts-cli.bats

      - name: bats — static prompt-contract (P1 regression + P3 drafts naming)
        run: bats tests/contract/static-prompt.bats

      - name: bats — P1 CLI surface (regression)
        run: bats tests/contract/cli-surface.bats

      - name: bats — P2 learn CLI surface (regression)
        run: bats tests/contract/learn-cli.bats

      - name: bats — P2 config get + global --vault (regression)
        run: bats tests/contract/config-cli.bats

      - name: bats — P2 hooks fail-soft smoke (regression)
        run: bats tests/contract/hooks-smoke.bats

      - name: bats — behavioral suite (skipped without KUNSKAP_LIVE_TESTS=1)
        run: bats tests/contract/behavioral.bats

      # ---------- end-to-end: init → curate --check → drafts list ----------

      - name: e2e — init produces a curator-runnable, drafts-queryable vault
        run: |
          # Hard contract for P3: the vault `kunskap init` produces must be
          # immediately runnable by the curator (curate --check) and the
          # drafts CLI (list against the empty _drafts/ returns cleanly).
          tmp="$(mktemp -d)/vault"
          KUNSKAP_AUTO_CONFIRM=1 ./bin/kunskap init "$tmp" --name "CI Smoke"
          ./bin/kunskap curate --vault "$tmp" --check
          ./bin/kunskap drafts list --vault "$tmp" | grep -q 'no drafts'
          ./bin/kunskap --vault "$tmp" config get shared | grep -qx 'false'

      # ---------- drift lint (P1 vault learning §7, P2 §8) ----------

      - name: CHANGELOG/README contain no hardcoded test counts
        run: |
          if grep -nE '\([0-9]+ tests?\)' CHANGELOG.md README.md 2>/dev/null; then
            echo "drift: hardcoded test count in CHANGELOG/README — remove or compute it dynamically"
            exit 1
          fi

      - name: CHANGELOG/README do not name retired CI workflow files
        run: |
          if grep -nE 'validate\.yml' CHANGELOG.md README.md 2>/dev/null; then
            echo "drift: CHANGELOG/README references retired validate.yml"
            exit 1
          fi
