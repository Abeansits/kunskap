name: P1 — curator contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install bats-core
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq

      - name: shellcheck bin/kunskap
        run: shellcheck -e SC1090,SC1091 bin/kunskap

      - name: agents/curator.md frontmatter parses
        run: |
          awk 'NR==1 && $0=="---"{f=1; next} f && $0=="---"{exit} f' agents/curator.md \
            | grep -qE '^name: curator'
          awk 'NR==1 && $0=="---"{f=1; next} f && $0=="---"{exit} f' agents/curator.md \
            | grep -qE '^model: opus'

      - name: commands/curate.md frontmatter parses
        run: |
          awk 'NR==1 && $0=="---"{f=1; next} f && $0=="---"{exit} f' commands/curate.md \
            | grep -qE '^description:'

      - name: static prompt-contract suite (29 tests)
        run: bats tests/contract/static-prompt.bats

      - name: CLI surface suite (20 tests)
        run: bats tests/contract/cli-surface.bats

      - name: behavioral suite (skipped without KUNSKAP_LIVE_TESTS=1)
        run: bats tests/contract/behavioral.bats
