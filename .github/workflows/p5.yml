name: P5 — role assignment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  p5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install bats + jq
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq

      # ---------- shellcheck (cumulative — bin/kunskap, hooks) ----------

      - name: shellcheck bin/kunskap + hooks
        run: |
          shellcheck -e SC1090,SC1091 bin/kunskap hooks/session-start.sh hooks/session-end.sh
          shellcheck hooks/_shared.sh

      # ---------- bin/kunskap surface health ----------

      - name: bin/kunskap version matches manifest
        run: |
          manifest=$(jq -r .version .claude-plugin/plugin.json)
          out=$(./bin/kunskap version)
          [[ "$out" == "kunskap $manifest" ]] \
            || { echo "drift: bin says '$out', plugin.json says '$manifest'"; exit 1; }

      - name: bin/kunskap help advertises P5 surface (--force / --yes)
        run: |
          ./bin/kunskap help | grep -q 'curate --vault <abs-path> \[--check\] \[--force\] \[--yes\]'
          ./bin/kunskap help | grep -q 'lint   \[--vault <abs-path>\] \[--format text|json\] \[--force\] \[--yes\]'
          ./bin/kunskap help | grep -q 'single-primary'
          ./bin/kunskap help | grep -q 'forced=true'
          ./bin/kunskap help | grep -q 'sandbox-CWD bug fix'

      # ---------- agents/{curator,linter}.md P5 contract clauses ----------

      - name: agents/curator.md encodes the run-record final step (P5)
        run: |
          grep -q 'kunskap: curator run record' agents/curator.md
          grep -q 'preserving any existing `linter` block' agents/curator.md

      - name: agents/linter.md encodes MUST 9 + last-run.json whitelist (P5)
        run: |
          grep -q 'MUST 9 — record the run' agents/linter.md
          grep -q 'SOLE permitted write' agents/linter.md
          grep -q 'kunskap: linter run record' agents/linter.md

      # ---------- bats suites ----------

      # P1 §7: dynamic counts; never encoded in step names.
      - name: list test counts
        run: |
          for f in tests/contract/*.bats; do
            n=$(grep -c '^@test ' "$f")
            printf '  %-35s %d cases\n' "$(basename "$f")" "$n"
          done

      # New P5 suites
      - name: bats — P5 role check CLI (P5)
        run: bats tests/contract/role-cli.bats

      - name: bats — P5 two-machine identity simulation (P5)
        run: bats tests/contract/two-machine.bats

      - name: bats — P5 last-run.json whitelist source surface (P5)
        run: bats tests/contract/last-run-cli.bats

      - name: bats — P5 TOML constrained-subset fuzz (P5)
        run: bats tests/contract/toml-fuzz.bats

      # Phase regression block: keep every prior phase green.
      - name: bats — P1 static prompt-contract (regression)
        run: bats tests/contract/static-prompt.bats

      - name: bats — P1 CLI surface (regression)
        run: bats tests/contract/cli-surface.bats

      - name: bats — P1 behavioral (skipped without KUNSKAP_LIVE_TESTS=1)
        run: bats tests/contract/behavioral.bats

      - name: bats — P2 learn CLI surface (regression)
        run: bats tests/contract/learn-cli.bats

      - name: bats — P2 config get + global --vault (regression)
        run: bats tests/contract/config-cli.bats

      - name: bats — P2 hooks fail-soft smoke (regression)
        run: bats tests/contract/hooks-smoke.bats

      - name: bats — P3 init CLI surface (regression)
        run: bats tests/contract/init-cli.bats

      - name: bats — P3 drafts CLI surface (regression)
        run: bats tests/contract/drafts-cli.bats

      - name: bats — P4 linter static prompt-contract (regression)
        run: bats tests/contract/linter-static-prompt.bats

      - name: bats — P4 lint CLI surface (regression)
        run: bats tests/contract/lint-cli.bats

      - name: bats — P4 linter behavioral (skipped without KUNSKAP_LIVE_TESTS=1)
        run: bats tests/contract/linter-behavioral.bats

      # ---------- end-to-end: init → curate-check → lint preflight ----------

      - name: e2e — init produces a curate-check + lint-preflight runnable vault
        run: |
          tmp="$(mktemp -d)/vault"
          KUNSKAP_AUTO_CONFIRM=1 ./bin/kunskap init "$tmp" --name "CI Smoke"
          # curate --check is a structure-only smoke; passes regardless of
          # role / identity (intentional — `--check` short-circuits before
          # role-check; the brief allows this).
          ./bin/kunskap curate --vault "$tmp" --check
          # Lint preflight without identity → identity-not-set refusal.
          # With identity AND TBD primary → role check warns and proceeds
          # to claude-PATH (which fails on CI).
          if PATH="/usr/bin:/bin" ./bin/kunskap lint --vault "$tmp" 2>&1 | tee /tmp/lint-noid.out; then
            echo "expected non-zero exit when identity is not set"; exit 1
          fi
          grep -q 'identity not set' /tmp/lint-noid.out
          # Set identity, retry — should reach claude-PATH check.
          xdg="$(mktemp -d)"
          mkdir -p "$xdg/kunskap"
          printf '[user]\nname  = "ci"\nhost  = "runner"\n' > "$xdg/kunskap/identity.toml"
          if XDG_CONFIG_HOME="$xdg" PATH="/usr/bin:/bin" ./bin/kunskap lint --vault "$tmp" 2>&1 | tee /tmp/lint-id.out; then
            echo "expected non-zero exit when claude is not on PATH"; exit 1
          fi
          grep -q 'no roles.<role>.primary configured' /tmp/lint-id.out  # TBD-primary warning
          grep -q 'claude' /tmp/lint-id.out
          # Vault must remain unmodified by failed preflight (read-only).
          ( cd "$tmp" && git add . && git -c user.email=ci@k -c user.name=ci commit -q -m seed )
          before="$(git -C "$tmp" status --porcelain)"
          XDG_CONFIG_HOME="$xdg" PATH="/usr/bin:/bin" ./bin/kunskap lint --vault "$tmp" 2>/dev/null || true
          after="$(git -C "$tmp" status --porcelain)"
          [[ "$before" == "$after" ]] || { echo "lint mutated vault on failed preflight"; exit 1; }

      # ---------- drift lint (P1 §7, P2 §8, P3 §8, P4 §9) ----------

      - name: CHANGELOG/README contain no hardcoded test counts
        run: |
          if grep -nE '\([0-9]+ tests?\)' CHANGELOG.md README.md 2>/dev/null; then
            echo "drift: hardcoded test count in CHANGELOG/README — remove or compute it dynamically"
            exit 1
          fi

      - name: CHANGELOG/README do not name retired CI workflow files
        run: |
          if grep -nE 'validate\.yml' CHANGELOG.md README.md 2>/dev/null; then
            echo "drift: CHANGELOG/README references retired validate.yml"
            exit 1
          fi

      # P4 §9 generalization — any "<int> MUST|tests|cases|bats" string in
      # CHANGELOG.md / README.md drifts the moment the underlying count
      # changes. Single source of truth = the test files themselves.
      - name: CHANGELOG/README do not embed numeric facts that drift (P4 §9)
        run: |
          if grep -nE '\b[0-9]+[[:space:]]+(MUST|tests?|cases|bats)\b' CHANGELOG.md README.md 2>/dev/null; then
            echo "drift: CHANGELOG/README embeds a numeric fact (\`<N> MUST/tests/cases/bats\`)"
            echo "       — remove the count or compute it dynamically (single source of truth)"
            exit 1
          fi

      # P4 §7 — fingerprint substring-collision detector. Each *_prompt_contains
      # call is a literal-string presence check; if one fingerprint is a
      # substring of another targeting the SAME prompt file, deleting the
      # smaller clause still passes the larger test. Scope by helper name
      # (prompt_contains → curator.md, linter_prompt_contains → linter.md)
      # so cross-file substrings aren't false-positives.
      - name: static-prompt fingerprint substring-collision detector (P4 ✨)
        run: |
          extract_one() {
            local helper="$1" file="$2"
            grep -hE "${helper}[[:space:]]+\"" "$file" \
              | sed -E "s/.*${helper}[[:space:]]+\"//" \
              | sed -E 's/"[[:space:]]*$//' \
              | sort -u
          }
          # bash 3.2 portable read-into-array (works on local macOS too).
          load() {
            local file="$1"; shift
            local helper="$1"
            local out_var="$2"
            local line
            local -a tmp=()
            while IFS= read -r line; do tmp+=("$line"); done < <(extract_one "$helper" "$file")
            eval "$out_var=(\"\${tmp[@]}\")"
          }
          curator_fp=()
          while IFS= read -r line; do curator_fp+=("$line"); done \
            < <(extract_one prompt_contains tests/contract/static-prompt.bats)
          linter_fp=()
          while IFS= read -r line; do linter_fp+=("$line"); done \
            < <(extract_one linter_prompt_contains tests/contract/linter-static-prompt.bats)
          collisions=0
          check() {
            local label="$1"; shift
            local arr=("$@")
            local i j a b
            for ((i = 0; i < ${#arr[@]}; i++)); do
              for ((j = 0; j < ${#arr[@]}; j++)); do
                [[ $i -eq $j ]] && continue
                a="${arr[$i]}"; b="${arr[$j]}"
                [[ -z "$a" || -z "$b" ]] && continue
                if [[ "$b" == *"$a"* && "$a" != "$b" ]]; then
                  echo "[$label] collision: \"$a\" is a substring of \"$b\""
                  collisions=$((collisions + 1))
                fi
              done
            done
          }
          check curator "${curator_fp[@]}"
          check linter  "${linter_fp[@]}"
          if [[ $collisions -gt 0 ]]; then
            echo "found $collisions fingerprint substring collisions — clauses on the SHORTER side can drift undetected (P4 vault learning §7)"
            exit 1
          fi
          echo "fingerprint-uniqueness OK (${#curator_fp[@]} curator + ${#linter_fp[@]} linter fingerprints)"
