name: P6 — search + polish + marketplace (v1.0)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  p6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install bats + jq + ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq ripgrep

      # ---------- shellcheck (cumulative — bin/kunskap, hooks) ----------

      - name: shellcheck bin/kunskap + hooks
        run: |
          shellcheck -e SC1090,SC1091 bin/kunskap hooks/session-start.sh hooks/post-write-sync.sh
          shellcheck hooks/_shared.sh

      # ---------- bin/kunskap surface health ----------

      - name: bin/kunskap version matches manifest (v1.0.x)
        run: |
          manifest=$(jq -r .version .claude-plugin/plugin.json)
          out=$(./bin/kunskap version)
          [[ "$out" == "kunskap $manifest" ]] \
            || { echo "drift: bin says '$out', plugin.json says '$manifest'"; exit 1; }
          [[ "$manifest" =~ ^1\.0\.[0-9]+$ ]] \
            || { echo "drift: P6 must ship in the v1.0.x line (got '$manifest')"; exit 1; }

      - name: bin/kunskap help advertises P6 recall surface
        run: |
          ./bin/kunskap help | grep -q 'recall <query>'
          ./bin/kunskap help | grep -q 'Stage 1 is `rg --type md` (load-bearing)'
          ./bin/kunskap help | grep -q 'Stage 2 is the Obsidian'
          ./bin/kunskap help | grep -q 'Identity-independent'

      # ---------- commands/recall.md frontmatter shape ----------

      - name: commands/recall.md has expected frontmatter + delegation
        run: |
          [[ -f commands/recall.md ]] || { echo "missing commands/recall.md"; exit 1; }
          head -1 commands/recall.md | grep -q '^---$'
          grep -q 'argument-hint:' commands/recall.md
          grep -q 'allowed-tools:' commands/recall.md
          grep -q 'kunskap recall \$ARGUMENTS' commands/recall.md

      # ---------- templates/vault-init/wiki/bases/ canonical Obsidian Bases ----------

      - name: templates ship 3 starter Obsidian Bases (P6)
        run: |
          for b in by-author recent draft-staleness; do
            f="templates/vault-init/wiki/bases/$b.base"
            [[ -f "$f" ]] || { echo "missing canonical base: $f"; exit 1; }
            # Bases must be valid YAML with at least filters + views top-level
            # keys per obsidian.md/help/bases/syntax.
            grep -q '^filters:' "$f"
            grep -q '^views:' "$f"
          done

      # ---------- bats suites ----------

      # P1 §7: dynamic counts; never encoded in step names.
      - name: list test counts
        run: |
          for f in tests/contract/*.bats; do
            n=$(grep -c '^@test ' "$f")
            printf '  %-35s %d cases\n' "$(basename "$f")" "$n"
          done

      # New P6 suite
      - name: bats — P6 recall CLI (P6)
        run: bats tests/contract/recall-cli.bats

      # Phase regression block: keep every prior phase green.
      - name: bats — P1 static prompt-contract (regression)
        run: bats tests/contract/static-prompt.bats

      - name: bats — P1 CLI surface (regression)
        run: bats tests/contract/cli-surface.bats

      - name: bats — P1 behavioral (skipped without KUNSKAP_LIVE_TESTS=1)
        run: bats tests/contract/behavioral.bats

      - name: bats — P2 learn CLI surface (regression)
        run: bats tests/contract/learn-cli.bats

      - name: bats — P2 config get + global --vault (regression)
        run: bats tests/contract/config-cli.bats

      - name: bats — P2 hooks fail-soft smoke (regression)
        run: bats tests/contract/hooks-smoke.bats

      - name: bats — P3 init CLI surface (regression)
        run: bats tests/contract/init-cli.bats

      - name: bats — P3 drafts CLI surface (regression)
        run: bats tests/contract/drafts-cli.bats

      - name: bats — P4 linter static prompt-contract (regression)
        run: bats tests/contract/linter-static-prompt.bats

      - name: bats — P4 lint CLI surface (regression)
        run: bats tests/contract/lint-cli.bats

      - name: bats — P4 linter behavioral (skipped without KUNSKAP_LIVE_TESTS=1)
        run: bats tests/contract/linter-behavioral.bats

      - name: bats — P5 role check CLI (regression)
        run: bats tests/contract/role-cli.bats

      - name: bats — P5 two-machine identity simulation (regression)
        run: bats tests/contract/two-machine.bats

      - name: bats — P5 last-run/<role>.json whitelist source surface (regression)
        run: bats tests/contract/last-run-cli.bats

      - name: bats — P5 TOML constrained-subset fuzz (regression)
        run: bats tests/contract/toml-fuzz.bats

      # ---------- end-to-end: init → recall ----------

      - name: e2e — init produces a recall-runnable vault
        run: |
          tmp="$(mktemp -d)/vault"
          KUNSKAP_AUTO_CONFIRM=1 ./bin/kunskap init "$tmp" --name "CI Smoke"
          # Sample seeded notes from `kunskap init` are content-bearing — recall
          # for "kunskap" must hit at least one of them. The exit code matters:
          # 0 = at least one hit, 1 = no hits.
          ./bin/kunskap recall "kunskap" --vault "$tmp" --format json | jq -e '.hits | length > 0'
          # Recall is read-only — vault state must be unchanged after.
          ( cd "$tmp" && git add . && git -c user.email=ci@k -c user.name=ci commit -q -m seed )
          before_status="$(git -C "$tmp" status --porcelain --untracked-files=all)"
          before_head="$(git -C "$tmp" rev-parse HEAD)"
          ./bin/kunskap recall "kunskap" --vault "$tmp" --format json >/dev/null
          after_status="$(git -C "$tmp" status --porcelain --untracked-files=all)"
          after_head="$(git -C "$tmp" rev-parse HEAD)"
          [[ "$before_status" == "$after_status" ]] || { echo "recall mutated working tree"; exit 1; }
          [[ "$before_head" == "$after_head" ]] || { echo "recall created a commit"; exit 1; }
          # No-hit query exits 1 cleanly.
          if ./bin/kunskap recall "absolutely-nonexistent-zzzz" --vault "$tmp" >/dev/null 2>&1; then
            echo "expected exit 1 on no-hit query"; exit 1
          fi

      # ---------- drift lint (P1 §7, P2 §8, P3 §8, P4 §9) ----------

      - name: CHANGELOG/README contain no hardcoded test counts
        run: |
          if grep -nE '\([0-9]+ tests?\)' CHANGELOG.md README.md 2>/dev/null; then
            echo "drift: hardcoded test count in CHANGELOG/README — remove or compute it dynamically"
            exit 1
          fi

      - name: CHANGELOG/README do not name retired CI workflow files
        run: |
          if grep -nE 'validate\.yml' CHANGELOG.md README.md 2>/dev/null; then
            echo "drift: CHANGELOG/README references retired validate.yml"
            exit 1
          fi

      - name: CHANGELOG/README do not embed numeric facts that drift (P4 §9)
        run: |
          if grep -nE '\b[0-9]+[[:space:]]+(MUST|tests?|cases|bats)\b' CHANGELOG.md README.md 2>/dev/null; then
            echo "drift: CHANGELOG/README embeds a numeric fact (\`<N> MUST/tests/cases/bats\`)"
            echo "       — remove the count or compute it dynamically (single source of truth)"
            exit 1
          fi

      # P4 §7 — fingerprint substring-collision detector. Scope by helper.
      - name: static-prompt fingerprint substring-collision detector (P5 ✨)
        run: |
          extract_one() {
            local helper="$1" file="$2"
            grep -hE "${helper}[[:space:]]+\"" "$file" \
              | sed -E "s/.*${helper}[[:space:]]+\"//" \
              | sed -E 's/"[[:space:]]*$//' \
              | sort -u
          }
          curator_fp=()
          while IFS= read -r line; do curator_fp+=("$line"); done \
            < <(extract_one prompt_contains tests/contract/static-prompt.bats)
          linter_fp=()
          while IFS= read -r line; do linter_fp+=("$line"); done \
            < <(extract_one linter_prompt_contains tests/contract/linter-static-prompt.bats)
          collisions=0
          check() {
            local label="$1"; shift
            local arr=("$@")
            local i j a b
            for ((i = 0; i < ${#arr[@]}; i++)); do
              for ((j = i + 1; j < ${#arr[@]}; j++)); do
                a="${arr[$i]}"; b="${arr[$j]}"
                [[ -z "$a" || -z "$b" || "$a" == "$b" ]] && continue
                if [[ "$a" == *"$b"* ]]; then
                  echo "[$label] collision: \"$b\" is a substring of \"$a\""
                  collisions=$((collisions + 1))
                fi
                if [[ "$b" == *"$a"* ]]; then
                  echo "[$label] collision: \"$a\" is a substring of \"$b\""
                  collisions=$((collisions + 1))
                fi
              done
            done
          }
          check curator "${curator_fp[@]}"
          check linter  "${linter_fp[@]}"
          if [[ $collisions -gt 0 ]]; then
            echo "found $collisions fingerprint substring collisions — clauses on the SHORTER side can drift undetected (P4 §7)"
            exit 1
          fi
          echo "fingerprint-uniqueness OK (${#curator_fp[@]} curator + ${#linter_fp[@]} linter fingerprints)"
